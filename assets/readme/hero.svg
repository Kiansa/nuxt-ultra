<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Nuxt Ultra</title>
  <desc id="desc">An agent skill that creates a Nuxt 4 project and turns it into a full-stack app from one prompt. A terminal shows the install command, the slash command, the create nuxt call it runs and the generated files: guest and protected route groups, useAuth, server db, shared schemas, locales and env files.</desc>

  <rect width="1200" height="420" rx="24" fill="#020420"/>
  <path d="M 24 0 H 1176 A 24 24 0 0 1 1200 24 V 96 H 0 V 24 A 24 24 0 0 1 24 0 Z" fill="#00DC82" opacity="0.045"/>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2.5" fill="#00DC82">AGENT SKILL · NUXT 4</text>
    <text x="-4" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="78" font-weight="800" letter-spacing="-2" fill="#FFFFFF">Nuxt Ultra</text>
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" fill="#C7D0E0">A new Nuxt 4 project, wired into an</text>
    <text x="0" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" fill="#C7D0E0">opinionated full-stack app from one prompt.</text>

    <g id="prompt-cue" transform="translate(0 296)">
      <rect x="0" y="0" width="286" height="52" rx="12" fill="#06132A" stroke="#00DC82" stroke-opacity="0.55"/>
      <text x="22" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#00DC82">›</text>
      <text x="44" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#FFFFFF">/nuxt-ultra-init</text>
    </g>
    <text x="0" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7C8AA5">auth · db · dashboard · i18n · seo · r2 · deploy</text>
  </g>

  <g id="project-proof" transform="translate(628 40)">
    <rect x="0" y="0" width="508" height="340" rx="16" fill="#080D26" stroke="#1B2547"/>
    <rect x="0" y="0" width="508" height="40" rx="16" fill="#0E1533"/>
    <rect x="0" y="24" width="508" height="16" fill="#0E1533"/>
    <circle cx="22" cy="20" r="6" fill="#FF5F57"/>
    <circle cx="42" cy="20" r="6" fill="#FEBC2E"/>
    <circle cx="62" cy="20" r="6" fill="#28C840"/>
    <text x="254" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7C8AA5">my-app</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <text x="24" y="76"><tspan fill="#7C8AA5">$ </tspan><tspan fill="#E2E8F0">npx skills add Kiansa/nuxt-ultra -g</tspan></text>
      <text x="24" y="104"><tspan fill="#00DC82">› </tspan><tspan fill="#00DC82">/nuxt-ultra-init</tspan></text>
      <text x="24" y="132"><tspan fill="#7C8AA5">↳ pnpm create nuxt@latest my-app</tspan></text>

      <line x1="24" y1="150" x2="484" y2="150" stroke="#1B2547"/>

      <text x="24" y="180" fill="#9FB0C8">app/pages/<tspan fill="#00DC82">(guest)</tspan>/login.vue</text>
      <text x="24" y="208" fill="#9FB0C8">app/pages/<tspan fill="#00DC82">(protected)</tspan>/dashboard/</text>
      <text x="24" y="236" fill="#9FB0C8">app/composables/useAuth.ts</text>
      <text x="24" y="264" fill="#9FB0C8">server/utils/db.ts</text>
      <text x="24" y="292" fill="#9FB0C8">shared/utils/schemas.ts</text>
      <text x="24" y="320" fill="#9FB0C8">i18n/locales/  .env.example  wrangler</text>
    </g>
    <rect x="0" y="330" width="508" height="10" rx="0" fill="#080D26"/>
  </g>
</svg>
